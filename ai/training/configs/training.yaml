# Future production template. rt-detr is RESERVED — scheduled after
# YOLOX-tiny (Sprint 19, ai/training/configs/model-v1.yaml is the real,
# working config for that family). Loading this config today fails loudly
# with that exact explanation, by design; this file just illustrates the
# shape a config for a not-yet-approved family takes.
name: safekids-detector-next
model:
  family: rt-detr           # gated: scheduled after yolox-tiny lands
  input_size: 640
dataset:
  # registry_root omitted -> resolved from GUARDIAN_DATASET_ROOT (external
  # asset, never a hardcoded repo-relative path; see docs/COLAB_SETUP.md)
  name: guardian-fall-detection-v1
  version: null             # null -> latest registered version
  format: video             # Sprint 18 VideoDatasetRegistry training export
epochs: 100
batch_size: 32
optimizer:
  name: sgd
  learning_rate: 0.01
  weight_decay: 0.0005
  momentum: 0.9
scheduler:
  name: cosine
augmentation:
  horizontal_flip: 0.5
early_stopping:
  enabled: true
  metric: map50
  mode: max
  patience: 10
seed: 2026
output_dir: ai/training/runs
device: cpu                 # cuda on the training server, cpu for dry runs
