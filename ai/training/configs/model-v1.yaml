# Sprint 19 — first REAL training run. Guardian Model v1 (candidate only;
# see reports/model-v1/ for the outcome and PROMOTE/KEEP-COCO recommendation).
#
# Full-spec hyperparameters below are exactly what Sprint 19 mandates and
# what the Colab notebook (ai/training/notebooks/model-v1-training.ipynb)
# runs on a T4 GPU via Run All. Running this same file locally on CPU/MPS
# works but is far slower — see reports/model-v1/README.md for what was
# actually executed in this repo versus what a full Colab run produces.
name: guardian-model-v1
model:
  family: yolox-tiny
  input_size: 640
dataset:
  registry_root: datasets/registry
  name: guardian-fall-detection-v1
  version: 1.0.0
  format: video              # Sprint 18 VideoDatasetRegistry training export
epochs: 30
batch_size: 16
optimizer:
  name: sgd
  learning_rate: 0.01
  weight_decay: 0.0005
  momentum: 0.9
scheduler:
  name: cosine
augmentation:
  horizontal_flip: 0.5
early_stopping:
  enabled: true
  metric: f1
  mode: max
  patience: 10
seed: 42
output_dir: ai/training/runs
device: cuda                 # Colab T4; override to cpu/mps for a local dry run
workers: 2
mixed_precision: true
