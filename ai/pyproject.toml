[project]
name = "guardian-ai-models"
version = "0.1.0"
description = "Guardian AI model development: datasets, training, evaluation, export (PyTorch -> ONNX -> TensorRT)."
requires-python = ">=3.10"
dependencies = [
    # Scaffold phase — heavy dependencies land together with the first training code:
    # torch, torchvision, opencv-python, onnx, onnxruntime
    # Detector choice is blocked on ADR-0003 (licensing) — do not add ultralytics here.
]

[dependency-groups]
dev = []  # shared dev tools come from the workspace root

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian_ai"]
