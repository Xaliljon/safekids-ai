[project]
name = "guardian-ai-models"
version = "0.1.0"
description = "Guardian AI model development: datasets, training, evaluation, export (PyTorch -> ONNX -> TensorRT)."
requires-python = ">=3.10"
dependencies = [
    # Training platform (Sprint 17, ADR-0003: no AGPL detectors — never ultralytics).
    "torch>=2.4",          # training engine; NEVER an edge dependency
    "numpy>=1.26",
    "pyyaml>=6.0",         # training configs
    "onnx>=1.16",          # export + structural validation
    "onnxruntime>=1.20",   # export parity check + latency benchmark
    "matplotlib>=3.8",     # visual reports (confusion matrix, curves, PDF)
    "pillow>=10.0",        # sample image IO
    # Dataset acquisition platform (Sprint 18). ffmpeg/ffprobe are system
    # prerequisites for video normalization (same binaries the ops scripts use).
    "opencv-python-headless>=4.10",  # video decode / frame extraction; annotator UI is a local web page
    "yolox",
    "loguru>=0.7",
    "thop>=0.1.1",
    "tabulate>=0.9",
    "ninja>=1.11",
]

[dependency-groups]
dev = []  # shared dev tools come from the workspace root

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian_ai"]

[tool.uv.sources]
yolox = { git = "https://github.com/Megvii-BaseDetection/YOLOX.git", rev = "419778480ab6ec0590e5d3831b3afb3b46ab2aa3" }
