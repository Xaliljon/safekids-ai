# Guardian AI — Python workspace root (virtual; not an installable package).
# Members are synced together with `uv sync --all-packages` (see Makefile).

[tool.uv.workspace]
members = [
    "ai",
    "edge",
    "backend",
    "packages/python/guardian_common",
]

[tool.uv]
# yolox's setup.py checks for torch at build time (to optionally precompile a
# C++ op) and must see our already-installed torch instead of an isolated
# build env with none.
no-build-isolation-package = ["yolox"]
# yolox/requirements.txt hard-pins ancient exact versions of packages we
# already depend on at modern versions for our OWN pipeline (export/eval);
# we only import yolox.models (architecture + loss + assignment), never its
# COCO-eval/export tooling, so these overrides are safe — see
# architecture/detector-integration.md.
override-dependencies = [
    "onnx>=1.16",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7",
    "types-psutil>=6.0",
    "onnx>=1.16",  # tests author tiny synthetic graphs; never a runtime dependency
]

# onnxruntime ships no type stubs; isolated behind the InferenceEngine port.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# yolox ships no py.typed marker / type stubs (Sprint 19.1, ADR-0003);
# isolated behind guardian_ai.training.detectors.yolox.
[[tool.mypy.overrides]]
module = ["yolox", "yolox.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Shared lint / format / type-check / test configuration.
# Component pyprojects must NOT redefine these — one style for the whole repo.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["ai", "edge", "backend", "packages/python/guardian_common"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (hidden side effects, mutable defaults)
    "SIM", # flake8-simplify (ENGINEERING.md: "Could it be simpler?")
    "N",   # pep8-naming
    "S",   # flake8-bandit (security by default)
    "T20", # no stray print statements — use logging
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311", "S310"]  # asserts; synthetic randomness; localhost urllib in server tests
"edge/guardian_edge/cli.py" = ["T201"]  # guardianctl talks to the operator via stdout
"ai/guardian_ai/train/__init__.py" = ["T201"]  # training CLI talks to the operator via stdout
"ai/guardian_ai/dataset/__init__.py" = ["T201"]  # dataset CLI talks to the operator via stdout
"ai/guardian_ai/training/coco_baseline.py" = ["T201"]  # standalone CLI wrapper prints its result
"ai/training/scripts/**" = ["T201", "S311"]  # operator scripts print; synthetic data uses random
"ai/training/notebooks/**" = ["T201"]  # Colab cells print for the human running them

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Checking floor is 3.12 because numpy's stubs use 3.12+ syntax and mypy
# always parses stubs. The real runtime floor (3.10 on Jetson/JetPack 6) is
# enforced by ci-edge, which installs and runs the tests on actual 3.10.
python_version = "3.12"
strict = true
pretty = true
warn_unreachable = true
ignore_missing_imports = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires services from docker/compose.yaml",
    "hardware: requires Guardian Edge Box hardware (Jetson/N100)",
    "benchmark: performance measurement; requires locally installed models",
    "stress: long-running stability/stress simulations",
    "network: downloads from an upstream host (model configs, checkpoints)",
]
