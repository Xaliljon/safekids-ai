[project]
name = "guardian-backend"
version = "0.1.0"
description = "Guardian AI cloud/on-prem backend: multi-site aggregation, auth, devices, notification fan-out. Never receives raw video streams."
requires-python = ">=3.10"
dependencies = [
    # Scaffold phase — service dependencies land with the first endpoint:
    # fastapi, uvicorn, sqlalchemy, alembic, asyncpg, redis, aio-pika, pydantic-settings, pyjwt
]

[dependency-groups]
dev = []  # shared dev tools come from the workspace root

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
