[project]
name = "guardian-edge"
version = "0.1.0"
description = "Guardian Edge Box runtime: camera ingest, local inference, risk detection, event generation. Offline-capable by design."
requires-python = ">=3.10"  # JetPack 6 ships Python 3.10 — do not raise without checking the Jetson target
dependencies = [
    # Camera service (Sprint 2):
    "opencv-python-headless>=4.10",  # RTSP capture via FFmpeg; headless — no GUI on the box
    "numpy>=1.26",                   # frame pixel buffers (overlay rendering; ships with opencv)
    "defusedxml>=0.7",               # WS-Discovery replies are untrusted network input
    "pyyaml>=6.0",                   # camera configuration files
    # AI pipeline (later): onnxruntime (canonical backend).
    # TensorRT comes from the JetPack system image, never from pip.
]

[dependency-groups]
dev = []  # shared dev tools come from the workspace root

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian_edge"]
