name: ci-dart

on:
  pull_request:
    paths:
      - "mobile/**"
      - "dashboard/**"
      - "packages/dart/**"
      - ".github/workflows/ci-dart.yml"
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "dashboard/**"
      - "packages/dart/**"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/dart/guardian_core
          - packages/dart/guardian_api_client
          - packages/dart/guardian_ui
          - mobile
          - dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Format check
        working-directory: ${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --no-pub
      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
            flutter test
          else
            echo "No tests yet — skipping."
          fi
