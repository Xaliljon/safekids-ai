name: safekids_mobile
description: SafeKids mobile application — director alert receive/review/confirm flow over the local network (no cloud).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any  # pinned by flutter_localizations
  # Mandated stack (CLAUDE.md): Riverpod (state/DI), GoRouter (navigation),
  # Dio (networking), Hive (local storage; see ADR-0015).
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  hive: ^2.2.3
  web_socket_channel: ^3.0.1
  path_provider: ^2.1.5
  guardian_core:
    path: ../packages/dart/guardian_core
  mobile_scanner: ^7.2.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true  # gen-l10n (lib/l10n/*.arb -> lib/l10n/generated)
