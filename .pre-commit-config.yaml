# Guardian AI pre-commit hooks — install with `make setup` (or `uv run pre-commit install`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      # Raw video/model files must never enter git (datasets policy).
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  # Must match the ruff the workspace resolves (pyproject: ruff>=0.8) — CI
  # runs `uv run ruff format --check`, and a hook on a different version
  # reformats exactly what CI then rejects.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
